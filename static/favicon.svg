<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="eyeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="pupilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00cec9" />
      <stop offset="100%" stop-color="#0984e3" />
    </linearGradient>
  </defs>
  <!-- Background Shield/Circle -->
  <rect width="64" height="64" rx="16" fill="url(#eyeBg)" />
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-opacity="0.5" />
  
  <!-- Outer Eye Contour -->
  <path d="M 10 32 C 18 19, 46 19, 54 32 C 46 45, 18 45, 10 32 Z" fill="none" stroke="url(#cyanGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Iris Circle -->
  <circle cx="32" cy="32" r="10" fill="url(#pupilGrad)" />
  
  <!-- Pupil -->
  <circle cx="32" cy="32" r="5" fill="#020617" />
  
  <!-- Glint / Highlight -->
  <circle cx="30" cy="30" r="2" fill="#ffffff" />
  
  <!-- Forensic Scan Line / Reticle Accent -->
  <line x1="6" y1="32" x2="12" y2="32" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" />
  <line x1="52" y1="32" x2="58" y2="32" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="12" x2="32" y2="18" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="46" x2="32" y2="52" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" />
</svg>
