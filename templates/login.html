{% extends "layout.html" %}

{% block title %}ThirdEye | Secure Sign-In{% endblock %}
{% block meta_description %}
<meta name="description" content="Secure portal sign-in for ThirdEye citizens, forensic artists, and law enforcement officers.">
{% endblock %}
{% block content %}
<div class="auth-page-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon-badge">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="auth-title">System Access</h2>
            <p class="auth-subtitle">Sign in to your ThirdEye workspace</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-3">
                <label for="username" class="form-label" style="font-weight: 500; font-size: 0.88rem; color: var(--text-secondary);">
                    Username
                </label>
                <input
                    type="text"
                    class="form-control glass-input"
                    id="username"
                    name="username"
                    autocomplete="username"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="mb-4">
                <label for="password" class="form-label" style="font-weight: 500; font-size: 0.88rem; color: var(--text-secondary);">
                    Password
                </label>
                <div class="password-input-group position-relative">
                    <input
                        type="password"
                        class="form-control glass-input"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >
                    <button
                        type="button"
                        class="password-toggle-btn"
                        id="toggleLoginPasswordBtn"
                        aria-label="Show password"
                        title="Show password"
                        onclick="togglePasswordVisibility('password', 'toggleLoginPasswordBtn', 'toggleLoginPasswordIcon')"
                    >
                        <i class="fa-regular fa-eye" id="toggleLoginPasswordIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-neon-primary w-100" style="padding: 12px; font-size: 0.95rem;">
                Sign In
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{{ url_for('register') }}">Create an account</a>
        </div>
    </div>
</div>

<script>
function togglePasswordVisibility(inputId, btnId, iconId) {
    const input = document.getElementById(inputId);
    const btn = document.getElementById(btnId);
    const icon = document.getElementById(iconId);
    if (!input) return;

    if (input.type === 'password') {
        input.type = 'text';
        if (btn) {
            btn.setAttribute('aria-label', 'Hide password');
            btn.setAttribute('title', 'Hide password');
        }
        if (icon) {
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        }
    } else {
        input.type = 'password';
        if (btn) {
            btn.setAttribute('aria-label', 'Show password');
            btn.setAttribute('title', 'Show password');
        }
        if (icon) {
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
}
</script>
{% endblock %}
